name: release

# On a version tag push (vX.Y), verify the tag matches package.json, build the
# app, enforce the app-image ceiling, and publish a GitHub Release with the .pbw
# attached (named pebble-crossword-vX.Y.pbw).
#
# The build steps live in the .github/actions/pebble-build composite action,
# shared with ci.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "::error::tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Build Pebble app
        uses: ./.github/actions/pebble-build

      - name: Stage .pbw
        run: |
          set -euo pipefail
          cp build/pebble-crossword.pbw "pebble-crossword-${GITHUB_REF_NAME}.pbw"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "pebble-crossword-${GITHUB_REF_NAME}.pbw" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build for ${GITHUB_REF_NAME}. See CHANGELOG.md for details." \
            --verify-tag
